<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" aria-label="InAmigos Foundation Logo">
  <defs>
    <linearGradient id="inamigos-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CC83" />
      <stop offset="100%" stop-color="#01B373" />
    </linearGradient>
    <linearGradient id="inamigos-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="inamigos-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222740" />
      <stop offset="100%" stop-color="#191D30" />
    </linearGradient>
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00CC83" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="236" fill="url(#inamigos-dark-grad)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#inamigos-emerald-grad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.6" />

  <!-- Inner Soft Glow Background -->
  <circle cx="256" cy="256" r="190" fill="#1E2337" filter="url(#glow-shadow)" />

  <!-- Interconnected Unity Arch / Hands Base -->
  <path d="M 136 340 C 170 300, 342 300, 376 340 C 390 356, 370 380, 348 376 C 298 366, 214 366, 164 376 C 142 380, 122 356, 136 340 Z" fill="url(#inamigos-emerald-grad)" />

  <!-- Heart of Compassion -->
  <path d="M 256 160 C 230 110, 170 125, 170 175 C 170 230, 256 280, 256 280 C 256 280, 342 230, 342 175 C 342 125, 282 110, 256 160 Z" fill="url(#inamigos-emerald-grad)" />

  <!-- Golden Sun of Hope inside Heart -->
  <circle cx="256" cy="180" r="24" fill="url(#inamigos-gold-grad)" />

  <!-- Human Figure Sparks (Youth Ambassadors) -->
  <!-- Center Figure Head -->
  <circle cx="256" cy="115" r="18" fill="url(#inamigos-gold-grad)" />
  
  <!-- Left Figure -->
  <circle cx="175" cy="155" r="14" fill="#FFFFFF" opacity="0.9" />
  <path d="M 155 200 C 155 175, 195 175, 195 200 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Right Figure -->
  <circle cx="337" cy="155" r="14" fill="#FFFFFF" opacity="0.9" />
  <path d="M 317 200 C 317 175, 357 175, 357 200 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Star of Excellence & Accreditation Sparkles -->
  <path d="M 256 70 L 261 82 L 274 84 L 264 93 L 267 106 L 256 99 L 245 106 L 248 93 L 238 84 L 251 82 Z" fill="url(#inamigos-gold-grad)" />
  <circle cx="105" cy="256" r="6" fill="#00CC83" />
  <circle cx="407" cy="256" r="6" fill="#00CC83" />
</svg>
